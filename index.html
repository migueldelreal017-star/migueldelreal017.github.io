de<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi primera web</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #6c5ce7;
    color: white;
    text-align: center;
    padding: 40px 20px;
    transition: background 0.5s;
  }
  .emoji {
    font-size: 90px;
    display: inline-block;
    transition: transform 0.4s;
  }
  button {
    font-size: 20px;
    padding: 15px 25px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #333;
    cursor: pointer;
  }
  #dato {
    font-size: 22px;
    margin-top: 25px;
    min-height: 60px;
  }
</style>
</head>
<body>

  <!-- CAMBIA ESTO: tu emoji favorito -->
  <div class="emoji" id="emoji">☠️🏴‍☠️</div>

  <!-- CAMBIA ESTO: tu nombre -->
  <h1>Hola, soy Miguel</h1>

  <p>Esta es mi primera página web y la hice yo.</p>
  <button onclick="sorpresa()">Toca para conocerme 🎲</button>
  <p id="dato"></p>

<script>
  // CAMBIA ESTO: escribe datos curiosos sobre ti
  // Cada dato va entre comillas y termina en coma
  const datos = [
    "Puedo durar días sin dormir, se me hace imposible dormir 8 horas, con 4 es suficiente  🥱",
    "Tengo buena puntería, una vez escalabre a mi hermano en pleno bosque, sin saber dónde estaba, tiré el peñón para arriba y justo le cayó, cuando lo vi fue chorreando sangre, siempre me pasa eso, el peñón encuentra al objetivo sin saber su ubicación 🦾🏹🎯🩸",
    "La gente me suele confundir mucho, a veces me saludan por error, me preguntan si estaba en cierto lugar, pero claramente no era yo, siempre me asocian com un conocido de ellos.👀😎",
    "Siempre suelo interesarme por un tema, una cosa o una persona por un tiempo, hasta obsesionarme pero luego me desistereso totalmente 🫥",
    "puedo durar hasta un año sin salir de mi cuarto y no pasa nada, soy introvertido y extrovertido a la vez, también me dicen que soy insensible, hiero a las personas sin querer, porque no siento que a mi no me hiriera lo que dije o lo que dije , se lo toan todo muy a pecho 🤷🏻‍♂️",
    " Suelo durar mucho tiempo sin hablar con alguien y aún asi tenerle aprecio o hablar normalmente como de toda la vida 💆🏻‍♂️",
    " Siempre encuentro gente muy parecida en el físico y en la personalidad y puedo predecir su comportamiento 🤓",
  ];

  // Colores de fondo que irán apareciendo
  const colores = ["#6c5ce7", "#e84393", "#00b894", "#e17055", "#0984e3", "#d63031"];

  function sorpresa() {
    const dato = datos[Math.floor(Math.random() * datos.length)];
    const color = colores[Math.floor(Math.random() * colores.length)];
    const giro = Math.floor(Math.random() * 60) - 30;

    document.getElementById("dato").textContent = dato;
    document.body.style.background = color;
    document.getElementById("emoji").style.transform = "rotate(" + giro + "deg) scale(1.2)";
  }
</script>

</body>
</html>
